<svg xmlns="http://www.w3.org/2000/svg" xmlns:xhtml="http://www.w3.org/1999/xhtml" width="680" height="400">
  <foreignObject width="100%" height="100%">
    <xhtml:div xmlns:xhtml="http://www.w3.org/1999/xhtml">
      <style>
        .carousel {
          width: 100%;
          height: 100%;
          overflow: hidden;
          position: relative;
          border-radius: 8px;
        }
        .slide {
          position: absolute;
          width: 100%;
          height: 100%;
          opacity: 0;
          transition: opacity 0.8s ease;
        }
        .slide img {
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
        .slide:nth-child(1) { animation: fade 9s infinite; animation-delay: 0s; }
        .slide:nth-child(2) { animation: fade 9s infinite; animation-delay: 3s; }
        .slide:nth-child(3) { animation: fade 9s infinite; animation-delay: 6s; }
        @keyframes fade {
          0%   { opacity: 0; }
          10%  { opacity: 1; }
          33%  { opacity: 1; }
          43%  { opacity: 0; }
          100% { opacity: 0; }
        }
      </style>
      <div class="carousel">
        <div class="slide"><img src="https://raw.githubusercontent.com/dleyyyy/dleyyyy/main/Facebook_Post.jpg"/></div>
        <div class="slide"><img src="https://raw.githubusercontent.com/dleyyyy/dleyyyy/main/UserLanding.png"/></div>
        <div class="slide"><img src="https://raw.githubusercontent.com/dleyyyy/dleyyyy/main/Functions.png"/></div>
        <div class="slide"><img src="https://raw.githubusercontent.com/dleyyyy/dleyyyy/main/AboutNCRDEC.png"/></div>
        <div class="slide"><img src="https://raw.githubusercontent.com/dleyyyy/dleyyyy/main/NCRDEC_Socials.png"/></div>
      </div>
    </xhtml:div>
  </foreignObject>
</svg>   